<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love You Myvon</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const targetName = "Myvon";
const words = ["Love You", "love you", "LOVE YOU", "I Love You", "love you()"];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); buildParticles(); });

function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
function heartY(t) { return -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)); }

let particles = [];

function buildParticles() {
  particles = [];
  const scale = Math.min(W, H) * 0.037;
  const cx = W / 2;
  const cy = H / 2;
  const N = 250;
  for (let i = 0; i < N; i++) {
    const t = (i / N) * 2 * Math.PI;
    const tx = cx + heartX(t) * scale;
    const ty = cy + heartY(t) * scale;
    particles.push({
      tx, ty,
      x: cx + (Math.random() - 0.5) * W,
      y: cy + (Math.random() - 0.5) * H,
      word: words[Math.floor(Math.random() * words.length)],
      alpha: 0,
      size: 11 + Math.random() * 6,
      pulse: Math.random() * Math.PI * 2,
      arrived: false,
      delay: Math.floor(i * 6),
      frame: 0,
    });
  }
}

buildParticles();

let frame = 0;
let nameAlpha = 0;
let allDone = false;

function draw() {
  frame++;

  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(0, 0, W, H);

  let doneCount = 0;

  for (const p of particles) {
    p.frame++;
    if (p.frame < p.delay) continue;

    if (!p.arrived) {
      p.x += (p.tx - p.x) * 0.04;
      p.y += (p.ty - p.y) * 0.04;
      p.alpha = Math.min(1, p.alpha + 0.025);
      if (Math.hypot(p.tx - p.x, p.ty - p.y) < 1) p.arrived = true;
    } else {
      doneCount++;
    }

    p.pulse += 0.02;
    const glow = 0.55 + 0.45 * Math.sin(p.pulse);

    const r = Math.floor(10 + 20 * glow);
    const g = Math.floor(130 + 90 * glow);
    const b = 255;

    ctx.save();
    ctx.globalAlpha = p.alpha * (0.65 + 0.35 * glow);
    ctx.font = `${p.size}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.shadowColor = `rgb(${r},${g},${b})`;
    ctx.shadowBlur = 12 + 10 * glow;
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillText(p.word, p.x, p.y);
    ctx.restore();
  }

  if (doneCount > particles.length * 0.85) allDone = true;

  if (allDone) {
    nameAlpha = Math.min(1, nameAlpha + 0.01);
    const pulse = 0.85 + 0.15 * Math.sin(frame * 0.035);
    const fs = Math.max(20, Math.min(W * 0.065, 44));
    ctx.save();
    ctx.globalAlpha = nameAlpha * pulse;
    ctx.font = `bold ${fs}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.shadowColor = '#00cfff';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`\u2665  ${targetName}  \u2665`, W / 2, H / 2 + Math.min(W, H) * 0.30);
    ctx.restore();
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
